name: Echograph
options:
  bundleIdPrefix: by.timberbid
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  knownRegions:
    - en
    - ru
    - de
    - fr
    - ja
    - Base
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: U5BAN54DL2
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: 2.4.0
  # On-device fallback LLM (Qwen3, Apache-2.0) for devices without Apple
  # Intelligence — see Echograph/Summary/LocalLLMService.swift.
  #
  # NOTE: the task brief that kicked this off pointed at
  # ml-explore/mlx-swift-examples for the MLXLLM/MLXLMCommon products, but
  # that repo split those libraries out into a dedicated package — its
  # current README says so explicitly:
  #   "MLXLMCommon, MLXLLM, MLXVLM and MLXEmbedders have moved to a new
  #    repository containing only reusable libraries: mlx-swift-lm"
  # Verified against mlx-swift-lm's own Package.swift (no tags published
  # yet, hence `branch: main` rather than a version pin — same pattern the
  # brief specified for the old URL).
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    branch: main
  # Hugging Face Hub client + tokenizer, used by MLXHuggingFace's
  # #huggingFaceLoadModelContainer macro to download/cache model weights.
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0

targets:
  Echograph:
    type: application
    platform: iOS
    sources:
      - path: Echograph
        excludes:
          - "Info.plist"
      - path: Shared
    resources:
      - path: Echograph/Resources
        optional: true
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    # Live Activity widget extension — disabled by default because iOS Simulator
    # consistently fails to register it ("Failed to get descriptors for
    # extensionBundleID"). The widget target itself still compiles. Re-enable
    # this dependency when running on a real device to test the Dynamic Island
    # / Lock Screen widget:
    # - target: EchographLiveActivity
    #
    # EchographWatch is a separate target — to embed it into the iOS bundle,
    # install the watchOS Simulator runtime (Xcode › Settings › Components)
    # and then re-enable the embed line below.
    # - target: EchographWatch
    #   embed: true
    #   codeSign: true
    info:
      path: Echograph/Info.plist
      properties:
        CFBundleDisplayName: Voicekeep
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "8"
        UILaunchScreen:
          UIColorName: ""
        NSMicrophoneUsageDescription: "Voicekeep records your voice locally — audio never leaves your device."
        NSSpeechRecognitionUsageDescription: "Voicekeep transcribes recordings on-device using Apple Speech. Audio never leaves your device."
        NSRemindersFullAccessUsageDescription: "Voicekeep creates reminders from transcript segments only when you tap Add to Reminders."
        NSRemindersUsageDescription: "Voicekeep creates reminders from transcript segments only when you tap Add to Reminders."
        NSCalendarsFullAccessUsageDescription: "Voicekeep creates calendar events from recordings only when you tap Add to Calendar."
        NSCalendarsUsageDescription: "Voicekeep creates calendar events from recordings only when you tap Add to Calendar."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The Mac AI Analyzer reaches the user's Mac over a Cloudflare
        # tunnel (HTTPS). Local-network HTTP is still allowed for the LAN
        # fallback case (192.168.x.x).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Export compliance: only Apple's standard HTTPS/Keychain crypto is used,
        # nothing classified as non-exempt under U.S. EAR §740.17(b). Setting this
        # to false suppresses the "Export Compliance" prompt for every TestFlight
        # build going forward.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - public.aifc-audio
              - com.apple.m4a-audio
            LSHandlerRank: Alternate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.timberbid.echograph
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  EchographUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EchographUITests
    dependencies:
      - target: Echograph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.timberbid.echograph.UITests
        TEST_TARGET_NAME: Echograph
        GENERATE_INFOPLIST_FILE: YES

  EchographLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - EchographLiveActivity
      - path: Shared
    info:
      path: EchographLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Echograph Live Activity
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.timberbid.echograph.LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "8"

  EchographWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - EchographWatch
    info:
      path: EchographWatch/Info.plist
      properties:
        CFBundleDisplayName: Echograph
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "8"
        WKApplication: true
        WKCompanionAppBundleIdentifier: by.timberbid.echograph
        WKWatchOnly: false
        NSMicrophoneUsageDescription: "Echograph records your voice locally on Apple Watch."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.timberbid.echograph.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "8"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY_watchos: "4"

schemes:
  Echograph:
    build:
      targets:
        Echograph: all
        EchographUITests: [test]
    run:
      storeKitConfiguration: StoreKitTesting/Echograph.storekit
    test:
      targets:
        - EchographUITests
